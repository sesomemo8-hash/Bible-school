    let appState = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          return { ...INITIAL_STATE, ...parsed };
        }
      } catch (e) {}
      const fresh = JSON.parse(JSON.stringify(INITIAL_STATE));
      CLASSES.forEach((cls) => {
        fresh.quizzes[cls] = generateDefaultQuiz(cls, 'إنجيل متى', 5, 1, 10);
      });
      return fresh;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {}
    }

    // =========================================================================
    // 3. دوال مساعدة وصلاحيات
    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, icon = '✨') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto bg-slate-900/95 text-white px-4 py-3 rounded-2xl shadow-xl border border-amber-400/40 flex items-center gap-2.5 text-xs sm:text-sm font-extrabold transition-all';
      toast.innerHTML = `<span class="text-lg">${icon}</span><span class="flex-1 leading-relaxed">${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    function getActiveLogoSrc() {
      return appState.customLogo || ATTACHED_COVER_LOGO;
    }

    function isAdmin() {
      return appState.currentUser && appState.currentUser.role === 'admin';
    }

    function isServant() {
      return appState.currentUser && appState.currentUser.role === 'servant';
    }

    function isStudent() {
      return appState.currentUser && appState.currentUser.role === 'student';
    }

    function getAccessibleClasses() {
      if (!appState.currentUser) return [];
      if (isAdmin()) return [...CLASSES];
      if (isServant()) return appState.currentUser.assignedClasses || [appState.currentUser.className];
      return [appState.currentUser.className];
    }

    function ensureSelectedClass() {
      const allowed = getAccessibleClasses();
      if (!allowed.length) return;
      if (!allowed.includes(appState.selectedClass)) {
        appState.selectedClass = allowed[0];
      }
    }

    function getClassStudents(cls) {
      return appState.users.filter((u) => u.role === 'student' && u.status === 'approved' && u.className === cls);
    }

    function getStudentScore(studentId) {
      if (!appState.studentScores[studentId]) {
        appState.studentScores[studentId] = {
          attendancePts: 0,
          biblePts: 0,
          versePts: 0,
          conductPts: 0,

          bonatWeekEarned: 0,

      return appState.studentScores[studentId];
    }

    // قاعدة حساب البونات الأسبوعية بدقة (الخميس إلى الأربعاء)
    function calculateWeeklyBonat(weekPoints) {
      if (weekPoints >= 7) return 5;
      if (weekPoints === 6) return 4;
      return 0;
    }

    function getTodayVersesForClass(cls) {
      const cfg = appState.readingConfigs[cls] || { book: 'إنجيل متى', chapter: 5, versesPerDay: 2, dayOffset: 0 };
      const bookData = BIBLE_CHAPTERS[cfg.book] || BIBLE_CHAPTERS['إنجيل متى'];
      const chapterVerses = bookData[cfg.chapter] || Object.values(bookData)[0];
      const count = Math.max(1, Number(cfg.versesPerDay) || 2);
      const startIdx = ((cfg.dayOffset || 0) * count) % chapterVerses.length;
      const verses = [];
      for (let i = 0; i < count; i++) {
        verses.push(chapterVerses[(startIdx + i) % chapterVerses.length]);
      }
      return { cfg, verses };
    }

                    <input id="join-password" type="password" required placeholder="اختر كلمة سر سهلة" class="w-full px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 focus:border-amber-500 outline-none text-sm font-bold" />
                  </div>
                </div>

                <button type="submit" class="w-full btn-kid bg-gradient-to-l from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black py-3.5 rounded-2xl shadow-lg text-base">
                  إرسال طلب الانضمام للمراجعة 📩
                </button>
              </form>
            `
            }
          </div>
        </div>
      `;
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value.trim();

      // التحقق أولاً هل الرقم موجود في طلبات الانضمام المعلقة أو المرفوضة (قاعدة صارمة لمنع التصفح قبل القبول)
      const pendingOrRejected = appState.joinRequests.find((r) => r.phone === phone && r.password === password);
      if (pendingOrRejected && pendingOrRejected.status !== 'approved') {
        if (pendingOrRejected.status === 'pending') {
          showToast('⛔ طلب انضمامك لا يزال «قيد المراجعة» وبانتظار موافقة الأدمن. لا يمكنك الدخول حالياً.', '⏳');
        } else {
          showToast('❌ عذراً، تم رفض طلب الانضمام. يرجى مراجعة أمين الخدمة.', '🚫');
        }
        return;
      }

      const user = appState.users.find((u) => u.phone === phone && u.password === password);
      if (!user) {
        showToast('بيانات الدخول غير صحيحة! تأكد من رقم التليفون وكلمة السر.', '⚠️');
        return;
      }
      if (user.status !== 'approved') {
        showToast('⛔ حسابك غير مفعّل بعد وبانتظار موافقة الأدمن.', '⏳');
        return;
      }

      appState.currentUser = user;
      appState.screen = 'app';
      appState.activeNav = 'home';
      ensureSelectedClass();
      saveState();
      showToast(`أهلاً بك يا ${user.fullName} في مدرسة الكتاب المقدس! 🌟`, '🎉');
      render();
    }

    function quickLoginById(userId) {
      const user = appState.users.find((u) => u.id === userId && u.status === 'approved');
      if (!user) return;
      appState.currentUser = user;
      appState.screen = 'app';
      appState.activeNav = 'home';
      ensureSelectedClass();
      saveState();
      showToast(`تم الدخول السريع كـ ${user.fullName}`, '👆');
      render();
    }

    function handleJoinRequestSubmit(e) {
      e.preventDefault();
      const role = document.getElementById('join-role').value;
      const className = document.getElementById('join-class').value;
      const fullName = document.getElementById('join-name').value.trim();
      const phone = document.getElementById('join-phone').value.trim();
      const parentPhone = document.getElementById('join-parent-phone').value.trim();
      const birthDate = document.getElementById('join-birth').value;
      const password = document.getElementById('join-password').value.trim();
      const fileInput = document.getElementById('join-avatar');
      const file = fileInput.files && fileInput.files[0];

      const nameParts = fullName.split(/\s+/).filter(Boolean);
      if (nameParts.length < 3) {
        showToast('يرجى إدخال الاسم ثلاثياً على الأقل!', '✍️');
        return;
      }
      if (!file) {
        showToast('يرجى رفع الصورة الشخصية للمخدوم!', '📸');
        return;
      }
      if (appState.users.some((u) => u.phone === phone) || appState.joinRequests.some((r) => r.phone === phone)) {
        showToast('رقم التليفون مسجل بالفعل في النظام!', '📱');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (ev) {
        const newReq = {
          id: 'req-' + Date.now(),
          role,
          fullName,
          phone,
          parentPhone,
          password,
          birthDate,
          className,
          status: 'pending',
          avatar: ev.target.result,
          createdAt: new Date().toLocaleDateString('ar-EG'),
        };
        appState.joinRequests.unshift(newReq);
        appState.authTab = 'login';
        saveState();
        showToast('✅ تم إرسال طلب الانضمام بنجاح! حسابك الآن «قيد المراجعة» ولن يتم فتح التطبيق إلا بعد موافقة الأدمن.', '⏳');
        render();
      };
      reader.readAsDataURL(file);
    }

    function logoutUser() {
      stopDailyReadingAudio();
      appState.currentUser = null;
      appState.screen = 'cover';
      saveState();
      render();
    }

    // =========================================================================
    // 6. الهيكل الرئيسي للتطبيق (بعد تسجيل الدخول المعتمد فقط)
    // =========================================================================
    function renderAppShell() {
      // حماية صارمة: لا يسمح بالعرض إلا لمستخدم معتمد
      if (!appState.currentUser || appState.currentUser.status !== 'approved') {
        appState.screen = 'auth';
        return renderAuthScreen();

      ensureSelectedClass();
      const cls = appState.selectedClass;
      const allowedClasses = getAccessibleClasses();

      const navItems = [
        { id: 'home', label: 'الرئيسية', icon: '🏠' },

        { id: 'resources', label: 'محتوى الفصل', icon: '🎒' },

      return `

          <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b-2 border-blue-100 shadow-sm">
            <div class="max-w-6xl mx-auto px-3 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-2.5">
                <img src="${getActiveLogoSrc()}" onerror="this.onerror=null; this.src=getDefaultLogoDataUrl();" class="w-11 h-11 object-contain" alt="شعار" />
                <div>
                  <h1 class="text-sm sm:text-base font-black text-blue-950">مدرسة الكتاب المقدس</h1>
                  <p class="text-[11px] font-bold text-slate-500">كنيسة مارمينا العجائبي والبابا كيرلس السادس</p>
                </div>
              </div>

              <!-- اختيار الفصل (للمخدوم يظهر فصله فقط، وللخادم فصوله، وللأدمن كل الفصول الأربعة) -->
              <div class="flex items-center gap-2 flex-wrap">
                ${
                  allowedClasses.length > 1
                    ? `
                  <select onchange="appState.selectedClass=this.value; stopDailyReadingAudio(); render();" class="bg-amber-50 border-2 border-amber-300 text-amber-950 font-black text-xs sm:text-sm px-3 py-2 rounded-2xl outline-none">
                    ${allowedClasses.map((c) => `<option value="${c}" ${c === cls ? 'selected' : ''}>🏫 ${c}</option>`).join('')}

                }

                <div class="flex items-center gap-2 bg-blue-50 px-3 py-1.5 rounded-2xl border border-blue-100">
                  <img src="${appState.currentUser.avatar}" class="w-8 h-8 rounded-full object-cover" alt="صورة" />
                  <div class="hidden sm:block text-right">
                    <p class="text-xs font-black text-blue-950">${escapeHtml(appState.currentUser.fullName)}</p>
                    <p class="text-[10px] font-bold text-blue-600">${isAdmin() ? '👑 أدمن' : isServant() ? '🛡️ خادم' : '🎒 مخدوم'}</p>
                  </div>
                </div>

                <button onclick="logoutUser()" class="btn-kid bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-2 rounded-2xl text-xs font-extrabold">
                  خروج
                </button>
              </div>
            </div>

            <!-- شريط التنقل التفاعلي -->
            <nav class="max-w-6xl mx-auto px-3 sm:px-6 pb-2.5 flex items-center gap-2 overflow-x-auto">
              ${navItems
                .map(
                  (item) => `
                <button
                  onclick="appState.activeNav='${item.id}'; render();"
                  class="btn-kid whitespace-nowrap px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition-all ${
                    appState.activeNav === item.id
                      ? 'bg-gradient-to-l from-blue-600 to-sky-500 text-white shadow-md'
                      : 'bg-slate-100/80 hover:bg-blue-50 text-slate-700'
                  }"
                >
                  <span>${item.icon}</span>
                  <span>${item.label}</span>
                </button>
              `
                )
                .join('')}
            </nav>
          </header>

          <!-- محتوى الصفحة النشطة -->
          <main class="max-w-6xl w-full mx-auto px-3 sm:px-6 pt-5 flex-1">
            ${renderActiveTabContent(cls)}
          </main>
        </div>
      `;
    }

    function renderActiveTabContent(cls) {
      switch (appState.activeNav) {
        case 'attendance':
          return renderAttendanceTab(cls);
        case 'readings':
          return renderReadingsTab(cls);
        case 'quiz':
          return renderQuizTab(cls);
        case 'leaderboards':
          return renderLeaderboardsTab(cls);
        case 'resources':
          return renderResourcesTab(cls);
        case 'admin':
          return isAdmin() ? renderAdminTab() : renderHomeTab(cls);
        default:
          return renderHomeTab(cls);
      }
    }

    // =========================================================================
    // 7. الصفحة الرئيسية (فيديو الشرح التلقائي + التنبيهات + البونات + المقترحات والشكاوى)
    // =========================================================================
    function renderHomeTab(cls) {
      const myScore = isStudent() ? getStudentScore(appState.currentUser.id) : null;
      const totalCumulative = myScore
        ? myScore.evalTotal + myScore.quizTotal + myScore.readingCumulativePts
        : 0;
      const classAnns = appState.classAnnouncements.filter((a) => a.className === cls);

      const roleVideoTitle = isAdmin()
        ? '🎬 فيديو الشرح التوضيحي للأدمن (إدارة شاملة للمنصة)'
        : isServant()
        ? '🎬 فيديو الشرح التوضيحي للخادم (الحضور، القراءات، المسابقات)'
        : '🎬 فيديو الشرح التوضيحي للمخدوم (رحلتك الممتعة في مدرسة الكتاب المقدس)';

      const roleVideoScript = isAdmin()
        ? 'أهلاً بك يا أمين الخدمة. من لوحة الأدمن يمكنك مراجعة واعتماد طلبات الانضمام، إدارة الحسابات وكلمات السر، تعديل أي درجات يدوياً، ونشر التعليمات للخدام.'
        : isServant()
        ? 'أهلاً بك يا خادمنا المبارك. يمكنك تسجيل حضور المخدومين من الساعة 7 مساءً، متابعة تسجيلات القراءات اليومية، إعداد المسابقة الأسبوعية، وإرسال تنبيهات الفصل.'
        : 'أهلاً بك يا بطل ابتدائي في مدرسة الكتاب المقدس! اقرأ آياتك اليومية وسجل صوتك، احضر بدري ومعاك كتابك المقدس، وحل المسابقة الأسبوعية لتجمع البونات والأوسمة!';

      return `
        <div class="space-y-6">
          <!-- بطاقة الترحيب وفيديو الشرح التوضيحي التلقائي بالصوت والصورة -->
          <div class="bg-gradient-to-l from-blue-700 via-blue-600 to-sky-500 text-white rounded-3xl p-5 sm:p-7 shadow-kid">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-5">
              <div class="space-y-2 max-w-2xl">
                <span class="inline-block bg-white/20 px-3 py-1 rounded-full text-xs font-extrabold">🌟 ${escapeHtml(cls)}</span>
                <h2 class="text-xl sm:text-2xl font-black">أهلاً بك يا ${escapeHtml(appState.currentUser.fullName)}!</h2>
                <p class="text-xs sm:text-sm text-blue-50 font-bold leading-relaxed">${escapeHtml(roleVideoScript)}</p>
                <div class="pt-2 flex flex-wrap gap-2">
                  <button onclick="speakTextAr('${roleVideoScript.replace(/'/g, '')}')" class="btn-kid bg-amber-400 hover:bg-amber-300 text-blue-950 font-black px-4 py-2.5 rounded-2xl text-xs sm:text-sm shadow flex items-center gap-2">
                    <span>▶️</span>
                    <span>تشغيل الشرح التوضيحي بالصوت والصورة</span>
                  </button>
                  <button onclick="stopDailyReadingAudio()" class="btn-kid bg-white/20 hover:bg-white/30 text-white font-bold px-3.5 py-2.5 rounded-2xl text-xs">
                    ⏹️ إيقاف الصوت
                  </button>
                </div>
              </div>
              <div class="bg-white/15 backdrop-blur-sm border border-white/25 rounded-2xl p-4 lg:w-80 space-y-2">
                <p class="text-xs font-black text-amber-200">${roleVideoTitle}</p>
                <div class="h-24 rounded-xl bg-blue-950/40 flex flex-col items-center justify-center text-center p-3 border border-white/10">
                  <span class="text-3xl mb-1">🎥</span>
                  <span class="text-[11px] font-bold text-blue-100">عرض تفاعلي مولّد تلقائياً حسب صلاحيتك</span>
                </div>
              </div>
            </div>
          </div>

          <!-- بطاقة درجات وبونات المخدوم على الشاشة الرئيسية -->
          ${
            isStudent() && myScore
              ? `
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
              <div class="bg-white rounded-3xl p-4 border-2 border-blue-100 shadow-card text-center">
                <p class="text-2xl mb-1">🏅</p>
                <p class="text-xs font-bold text-slate-500">المجموع التراكمي الكلي</p>
                <p class="text-2xl font-black text-blue-900">${totalCumulative} <span class="text-xs">درجة</span></p>
              </div>
              <div class="bg-white rounded-3xl p-4 border-2 border-amber-200 shadow-card text-center">

                <p class="text-2xl font-black text-amber-600">${myScore.bonatDeliveredFlag ? 0 : myScore.bonatWeekEarned} <span class="text-xs">بون</span></p>
              </div>
              <div class="bg-white rounded-3xl p-4 border-2 border-emerald-100 shadow-card text-center">
                <p class="text-2xl mb-1">📖</p>
                <p class="text-xs font-bold text-slate-500">قراءات هذا الأسبوع</p>

                <p class="text-2xl mb-1">🧩</p>

          <!-- تنبيهات الفصل الهامة (تظهر بشكل كبير وواضح في الصفحة الرئيسية للفصل) -->
          <div class="bg-white rounded-3xl p-5 sm:p-6 border-2 border-sky-200 shadow-card space-y-4">

              <h3 class="text-base sm:text-lg font-black text-blue-950 flex items-center gap-2">
                <span>📢</span>
                <span>تنبيهات ${escapeHtml(cls)} الهامة</span>

            ${

                ? `

                    <div class="flex items-center justify-between text-xs">
                      <span class="font-black text-blue-900">${escapeHtml(a.title)}</span>

    function renderFeedbackManagementBox() {
      if (!isAdmin() && !isServant()) return '';

      const renderItem = (item, type) => {
        const isSug = type === 'suggestion';
        const badgeClass = isSug ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800';
        const cardClass = isSug ? 'bg-emerald-50/60 border-emerald-200' : 'bg-rose-50/60 border-rose-200';
        const inputId = isSug ? `reply-sug-${item.id}` : `reply-cmp-${item.id}`;
        const replyBlock = item.reply
          ? `<div class="bg-white p-2.5 rounded-xl border border-slate-200 text-xs space-y-1">
              <p class="font-black text-indigo-800">💬 رد ${escapeHtml(item.reply.byName)} (${escapeHtml(item.reply.byRole)}) • ${escapeHtml(item.reply.time)}:</p>
              <p class="font-bold text-slate-800">${escapeHtml(item.reply.text)}</p>
            </div>`
          : '';

        return `
          <div class="p-3.5 rounded-2xl border ${cardClass} space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-full font-black ${badgeClass}">${isSug ? '💡 مقترح' : '📩 شكوى'}</span>
                <span class="font-black text-slate-900">${escapeHtml(item.studentName)}</span>
                <span class="font-bold text-slate-500">(${escapeHtml(item.className)})</span>
              </div>
              <span class="text-slate-400 font-bold">${escapeHtml(item.time)}</span>
            </div>
            <p class="text-sm font-extrabold text-slate-800">${escapeHtml(item.text)}</p>
            ${replyBlock}
            <form onsubmit="replyToFeedback(event, '${type}', '${item.id}')" class="flex gap-2">
              <input id="${inputId}" type="text" required placeholder="${item.reply ? 'تعديل الرد...' : 'اكتب رداً للمخدوم (يظهر للأدمن والخدام والمخدوم صاحب الرسالة فقط)...'}" class="flex-1 px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-bold outline-none focus:border-indigo-500" />
              <button type="submit" class="btn-kid bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-extrabold">إرسال الرد</button>
            </form>
          </div>
        `;
      };

      const sugList = appState.suggestions.length
        ? appState.suggestions.map((s) => renderItem(s, 'suggestion')).join('')

    function addClassAnnouncement(e, cls) {
      e.preventDefault();
      const title = document.getElementById('ann-title').value.trim();
      const text = document.getElementById('ann-text').value.trim();
      if (!title || !text) return;
      appState.classAnnouncements.unshift({
        id: 'ann-' + Date.now(),
        className: cls,
        title,
        text,
        author: appState.currentUser.fullName,
        time: 'الآن',
        audioUrl: '',
      });
      saveState();
      showToast(`تم نشر التنبيه وإرسال إشعار فوري لجميع خدام ومخدومي ${cls} 🔔`, '📢');
      render();
    }

    function submitStudentFeedback(e, type) {
      e.preventDefault();
      const elId = type === 'suggestion' ? 'student-suggestion-text' : 'student-complaint-text';
      const text = document.getElementById(elId).value.trim();
      if (!text) return;
      const item = {
        id: type + '-' + Date.now(),
        studentId: appState.currentUser.id,
        studentName: appState.currentUser.fullName,
        className: appState.currentUser.className,
        text,
        time: 'الآن',
        reply: null,
      };
      if (type === 'suggestion') {
        appState.suggestions.unshift(item);
        showToast('تم إرسال مقترحك للأدمن والخدام بنجاح 💡', '✅');
      } else {
        appState.complaints.unshift(item);
        showToast('تم إرسال شكواك للأدمن والخدام بنجاح 📩', '✅');
      }
      document.getElementById(elId).value = '';
      saveState();
      render();
    }

    function replyToFeedback(e, type, itemId) {
      e.preventDefault();
      if (!isAdmin() && !isServant()) return;
      const inputId = type === 'suggestion' ? `reply-sug-${itemId}` : `reply-cmp-${itemId}`;
      const replyText = document.getElementById(inputId)?.value.trim();
      if (!replyText) return;

      const list = type === 'suggestion' ? appState.suggestions : appState.complaints;
      const item = list.find((x) => x.id === itemId);
      if (!item) return;

      item.reply = {
        text: replyText,
        byName: appState.currentUser.fullName,
        byRole: isAdmin() ? 'أدمن' : 'خادم',
        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
      };

      saveState();
      showToast(`تم إرسال الرد وسيظهر للأدمن والخدام وللمخدوم (${item.studentName}) فقط ✅`, '💬');
      render();
    }

    function recordAutoAttendance(studentId) {
      const sc = getStudentScore(studentId);
      const now = new Date();
      // حساب التأخير عن الساعة 7:00 مساءً (19:00)
      const startMinutes = 19 * 60;
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      let delay = 0;
      if (currentMinutes > startMinutes && currentMinutes <= 20 * 60 + 30) {
        delay = currentMinutes - startMinutes;
      }
      const attScore = Math.max(0, Number((20 - delay * 0.25).toFixed(2)));
      sc.attendancePts = attScore;
      sc.absentThisWeek = false;
      sc.lastCheckInTime = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      recalcEvalTotal(sc);
      saveState();
      showToast(`تم تسجيل الحضور الساعة ${sc.lastCheckInTime} بدرجة ${attScore} من 20 ✅`, '⏱️');
      render();
    }

    function markStudentAbsent(studentId) {
      const sc = getStudentScore(studentId);
      sc.attendancePts = 0;
      sc.biblePts = 0;
      sc.versePts = 0;
      sc.conductPts = 0;
      sc.evalTotal = 0;
      sc.absentThisWeek = true;
      sc.lastCheckInTime = 'غائب';
      saveState();
      showToast('تم تسجيل المخدوم في قائمة الغياب الأسبوعية', '📋');
      render();
    }

    function updateStudentEvalField(studentId, field, value) {
      if (field === 'attendancePts' && !isAdmin()) return;
      const sc = getStudentScore(studentId);
      sc[field] = Number(value) || 0;
      sc.absentThisWeek = false;
      recalcEvalTotal(sc);
      saveState();
      render();
    }

    function recalcEvalTotal(sc) {
      const raw = Number(sc.attendancePts) + Number(sc.biblePts) + Number(sc.versePts) + Number(sc.conductPts);
      sc.evalTotal = Math.min(45, Number(raw.toFixed(2)));
    }

    function saveReadingConfig(e, cls) {
      e.preventDefault();
      const prev = appState.readingConfigs[cls] || {};
      appState.readingConfigs[cls] = {
        book: document.getElementById('rc-book').value,
        chapter: Number(document.getElementById('rc-chapter').value) || 1,
        versesPerDay: Number(document.getElementById('rc-verses').value) || 1,
        dayOffset: prev.dayOffset || 0,
        audioFileUrl: prev.audioFileUrl || '',
        audioFileName: prev.audioFileName || '',
      };
      saveState();
      showToast(`تم تحديث القراءات اليومية لـ ${cls} بنجاح 📖`, '✅');
      render();
    }

    let mediaRecorderInstance = null;
    let recordedChunks = [];

    function startStudentVoiceRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('المتصفح لا يدعم التسجيل المباشر بالميكروفون، يمكنك استخدام زر التأكيد والإرسال مباشرة.', '🎤');
        return;
      }
      navigator.mediaDevices
        .getUserMedia({ audio: true })
        .then((stream) => {
          recordedChunks = [];
          mediaRecorderInstance = new MediaRecorder(stream);
          mediaRecorderInstance.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };
          mediaRecorderInstance.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(blob);
            finalizeStudentReadingSubmission(audioUrl);
            stream.getTracks().forEach((t) => t.stop());
          };
          mediaRecorderInstance.start();
          document.getElementById('btn-start-rec')?.classList.add('hidden');
          document.getElementById('btn-stop-rec')?.classList.remove('hidden');
          showToast('🎙️ بدأ التسجيل الصوتي... اقرأ الآيات بصوت واضح!', '🔴');
        })
        .catch(() => {
          showToast('تعذر الوصول للميكروفون، تأكد من السماح للمتصفح أو استخدم زر التأكيد.', '⚠️');
        });
    }

    function stopAndSubmitStudentVoiceRecording() {
      if (mediaRecorderInstance && mediaRecorderInstance.state !== 'inactive') {
        mediaRecorderInstance.stop();
      }
    }

    function submitQuickSimulatedReading() {
      finalizeStudentReadingSubmission('');
    }

    function finalizeStudentReadingSubmission(audioUrl) {
      if (!isStudent()) return;
      const todayKey = new Date().toISOString().slice(0, 10);
      const existingIdx = appState.dailyReadingSubmissions.findIndex(
        (r) => r.studentId === appState.currentUser.id && r.dateKey === todayKey
      );
      if (existingIdx !== -1 && appState.dailyReadingSubmissions[existingIdx].status !== 'rejected') {
        showToast('لقد قمت بتسجيل وإرسال قراءة اليوم بالفعل!', '⚠️');
        return;
      }

      const sub = {
        id: 'rec-' + Date.now(),
        studentId: appState.currentUser.id,
        studentName: appState.currentUser.fullName,
        className: appState.currentUser.className,
        dateKey: todayKey,
        status: 'submitted',
        rejectReason: '',
        audioUrl,
        submittedAt: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
      };

      if (existingIdx !== -1) {
        appState.dailyReadingSubmissions[existingIdx] = sub;
      } else {
        appState.dailyReadingSubmissions.unshift(sub);
      }

      const sc = getStudentScore(appState.currentUser.id);
      sc.readingWeekDays = Math.min(7, sc.readingWeekDays + 1);
      sc.readingCumulativeDays += 1;
      sc.readingWeekPts = Math.min(7, sc.readingWeekPts + 1);
      sc.readingCumulativePts += 1;
      const newWeekBonat = calculateWeeklyBonat(sc.readingWeekPts);
      if (newWeekBonat > sc.bonatWeekEarned) {
        sc.bonatCumulativeAvailable += newWeekBonat - sc.bonatWeekEarned;
        sc.bonatWeekEarned = newWeekBonat;
      }

      saveState();
      showToast('🎉 رائع يا بطل! تم إرسال قراءتك اليومية واحتُسبت لك +1 نقطة وتوقف التذكير لليوم.', '🌟');
      render();
    }

    function rejectStudentReading(subId) {
      const sub = appState.dailyReadingSubmissions.find((r) => r.id === subId);
      if (!sub) return;
      sub.status = 'rejected';
      sub.rejectReason = 'يرجى إعادة تسجيل تلاوة الآيات بصوت أوضح';
      const sc = getStudentScore(sub.studentId);
      sc.readingWeekDays = Math.max(0, sc.readingWeekDays - 1);
      sc.readingCumulativeDays = Math.max(0, sc.readingCumulativeDays - 1);
      sc.readingWeekPts = Math.max(0, sc.readingWeekPts - 1);
      sc.readingCumulativePts = Math.max(0, sc.readingCumulativePts - 1);
      sc.bonatWeekEarned = calculateWeeklyBonat(sc.readingWeekPts);
      saveState();
      showToast(`تم رفض القراءة وإرسال إشعار للمخدوم (${sub.studentName}) لإعادة التسجيل`, '📩');
      render();
    }

    function toggleBonatDelivered(studentId, checked) {
      const sc = getStudentScore(studentId);
      if (checked && !sc.bonatDeliveredFlag) {
        sc.bonatCumulativeAvailable = Math.max(0, sc.bonatCumulativeAvailable - sc.bonatWeekEarned);
        sc.bonatDeliveredFlag = true;
        showToast('تم تأكيد تسليم البونات وخصمها من الرصيد التراكمي دون المساس بعدد القراءات ✅', '🎟️');
      } else if (!checked && sc.bonatDeliveredFlag) {
        sc.bonatDeliveredFlag = false;
        sc.bonatCumulativeAvailable += sc.bonatWeekEarned;
      }
      saveState();
      render();
    }

    // =========================================================================
    // محرك القراءة اليومية المسموعة المزدوج (Speech + Web Audio + MP3)
    // =========================================================================
    let dailyReadingFallbackInterval = null;
    let dailyReadingClockInterval = null;

    function speakTextAr(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ar-EG';
          window.speechSynthesis.speak(u);
          return;
        } catch (e) {}
      }
      playGentleSynthChime();
      showToast(text, '🔊');
    }

    function playGentleSynthChime(freq = 523.25, duration = 0.22) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function updateAudioPlayerDOM() {
      const st = appState.audioPlayerState;
      const statusEl = document.getElementById('daily-audio-status');
      const barEl = document.getElementById('daily-audio-progress');
      const timerEl = document.getElementById('daily-audio-timer');
      if (statusEl) statusEl.textContent = st.statusMessage;
      if (barEl) barEl.style.width = `${st.progressPercent}%`;
      if (timerEl) {
        const mins = String(Math.floor(st.elapsedSeconds / 60)).padStart(2, '0');
        const secs = String(st.elapsedSeconds % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }
      document.querySelectorAll('[data-verse-idx]').forEach((el) => {
        const idx = Number(el.getAttribute('data-verse-idx'));
        if (idx === st.activeVerseIndex) {
          el.classList.add('bg-amber-200/90', 'border-amber-500', 'scale-[1.01]', 'shadow-sm');
        } else {
          el.classList.remove('bg-amber-200/90', 'border-amber-500', 'scale-[1.01]', 'shadow-sm');
        }
      });
    }

    function stopDailyReadingAudio() {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
      if (dailyReadingFallbackInterval) {
        clearInterval(dailyReadingFallbackInterval);
        dailyReadingFallbackInterval = null;
      }
      if (dailyReadingClockInterval) {
        clearInterval(dailyReadingClockInterval);
        dailyReadingClockInterval = null;
      }
      const mp3El = document.getElementById('class-uploaded-audio');
      if (mp3El) {
        mp3El.pause();
        mp3El.currentTime = 0;
      }
      appState.audioPlayerState.isPlaying = false;
      appState.audioPlayerState.isPaused = false;
      appState.audioPlayerState.activeVerseIndex = -1;
      appState.audioPlayerState.progressPercent = 0;
      appState.audioPlayerState.elapsedSeconds = 0;
      appState.audioPlayerState.statusMessage = 'تم إيقاف القراءة المسموعة';
      updateAudioPlayerDOM();
    }

    function pauseOrResumeDailyReadingAudio(cls) {
      const st = appState.audioPlayerState;
      if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
        if (!st.isPaused) {
          window.speechSynthesis.pause();
          st.isPaused = true;
          st.statusMessage = '⏸️ إيقاف مؤقت للقراءة المسموعة';
        } else {
          window.speechSynthesis.resume();
          st.isPaused = false;
          st.statusMessage = '🔊 جاري استكمال القراءة المسموعة...';
        }
        updateAudioPlayerDOM();
        return;
      }
      if (!st.isPlaying) startDailyReadingAudio(cls);
    }

    function setDailyReadingRate(rate, cls) {
      appState.audioPlayerState.rate = rate;
      showToast(`تم ضبط سرعة القراءة على ${rate}x`, '⚡');
      if (appState.audioPlayerState.isPlaying) {
        startDailyReadingAudio(cls);
      } else {
        render();
      }
    }

    function startDailyReadingAudio(cls) {
      stopDailyReadingAudio();
      const { verses } = getTodayVersesForClass(cls);
      const st = appState.audioPlayerState;
      st.isPlaying = true;
      st.isPaused = false;
      st.elapsedSeconds = 0;

      const mp3El = document.getElementById('class-uploaded-audio');
      if (mp3El && mp3El.getAttribute('src')) {
        mp3El.playbackRate = st.rate;
        mp3El.play().catch(() => {});
        st.statusMessage = '🎧 جاري تشغيل الملف الصوتي المرفوع للقراءة اليومية';
        updateAudioPlayerDOM();
        return;
      }

      dailyReadingClockInterval = setInterval(() => {
        if (!st.isPaused && st.isPlaying) {
          st.elapsedSeconds += 1;
          updateAudioPlayerDOM();
        }
      }, 1000);

      const runSynthVisualAudioFallback = () => {
        let idx = 0;
        const stepMs = Math.max(1800, Math.round(3200 / st.rate));
        const advanceVerse = () => {
          if (idx >= verses.length) {
            stopDailyReadingAudio();
            st.statusMessage = '✅ اكتملت القراءة اليومية المسموعة بنجاح';
            st.progressPercent = 100;
            updateAudioPlayerDOM();
            return;
          }
          st.activeVerseIndex = idx;
          st.progressPercent = Math.round(((idx + 1) / verses.length) * 100);
          st.statusMessage = `🎵 التتبع الصوتي والبصري التلاوتي — آية ${idx + 1} من ${verses.length}`;
          playGentleSynthChime(523.25 + idx * 65, 0.25);
          updateAudioPlayerDOM();
          idx++;
        };
        advanceVerse();
        dailyReadingFallbackInterval = setInterval(() => {
          if (!st.isPaused) advanceVerse();
        }, stepMs);
      };

      if ('speechSynthesis' in window) {
        let idx = 0;
        let fallbackTriggered = false;
        const speakVerse = () => {
          if (idx >= verses.length) {
            stopDailyReadingAudio();
            st.statusMessage = '✅ اكتملت القراءة اليومية المسموعة بنجاح';
            st.progressPercent = 100;
            updateAudioPlayerDOM();
            return;
          }
          st.activeVerseIndex = idx;
          st.progressPercent = Math.round(((idx + 1) / verses.length) * 100);
          st.statusMessage = `🔊 جاري قراءة الآية ${idx + 1} من ${verses.length}`;
          updateAudioPlayerDOM();

          const utter = new SpeechSynthesisUtterance(verses[idx]);
          utter.lang = 'ar-EG';
          utter.rate = st.rate;

          const guardTimeout = setTimeout(() => {
            if (!fallbackTriggered && !window.speechSynthesis.speaking) {
              fallbackTriggered = true;
              window.speechSynthesis.cancel();
              runSynthVisualAudioFallback();
            }
          }, 1100);

          utter.onstart = () => clearTimeout(guardTimeout);
          utter.onend = () => {
            clearTimeout(guardTimeout);
            if (!fallbackTriggered) {
              idx++;
              speakVerse();
            }
          };
          utter.onerror = () => {
            clearTimeout(guardTimeout);
            if (!fallbackTriggered) {
              fallbackTriggered = true;
              runSynthVisualAudioFallback();
            }
          };
          window.speechSynthesis.speak(utter);
        };
        speakVerse();
      } else {
        runSynthVisualAudioFallback();
      }
    }

    function submitQuizAnswers(e, cls) {
      e.preventDefault();
      if (!isStudent()) return;
      const quiz = appState.quizzes[cls];
      let score = 0;
      quiz.mcq.forEach((item, idx) => {
        const chosen = document.querySelector(`input[name="mcq-${idx}"]:checked`);
        if (chosen && Number(chosen.value) === item.correctIndex) score += 1;
      });
      quiz.tf.forEach((item, idx) => {
        const chosen = document.querySelector(`input[name="tf-${idx}"]:checked`);
        if (chosen && (chosen.value === 'true') === item.correctBool) score += 1;
      });
      const o0 = Number(document.querySelector('select[name="order-0"]').value);
      const o1 = Number(document.querySelector('select[name="order-1"]').value);
      const o2 = Number(document.querySelector('select[name="order-2"]').value);
      if (o0 === 0 && o1 === 1 && o2 === 2) score += 5;

      appState.quizResults[appState.currentUser.id] = score;
      const sc = getStudentScore(appState.currentUser.id);
      sc.quizTotal = score;
      saveState();
      showToast(`🎉 تم تصحيح المسابقة تلقائياً! نتيجتك الخاصة هي ${score} من 25 درجة`, '🏆');

    // =========================================================================
    function buildRankedListWithTies(students, getMetricFn) {
      const sorted = [...students]
        .map((s) => ({ student: s, score: getMetricFn(s) }))
        .sort((a, b) => b.score - a.score);

      let currentRank = 0;
      let lastScore = null;
      return sorted.map((item, idx) => {
        if (lastScore === null || item.score < lastScore) {
          currentRank = idx + 1;
          lastScore = item.score;
        }
        const isTied = sorted.filter((x) => x.score === item.score).length > 1;
        return { ...item, rank: currentRank, isTied };
      });
    }

                    : `<p class="text-xs font-bold text-slate-500">ابدأ المحادثة مع خدام الفصل والأدمن...</p>`
                }
              </div>
              <form onsubmit="sendServantChatMessage(event, '${cls}')" class="flex flex-wrap gap-2">
                <input id="chat-msg-input" type="text" required placeholder="اكتب رسالة أو أضف رابط/ملف لخدام الفصل..." class="flex-1 px-3.5 py-2.5 rounded-2xl border border-slate-300 text-xs font-bold outline-none" />
                <button type="button" onclick="appendStickerToChat('🙏🌟')" class="bg-amber-100 px-3 py-2 rounded-2xl text-sm">🙏🌟</button>
                <button type="submit" class="btn-kid bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-2xl text-xs font-extrabold">إرسال</button>
              </form>
            </div>
          `
              : ''
          }
        </div>
      `;
    }

    function addClassResource(e, cls) {
      e.preventDefault();
      if (isStudent()) return;
      const type = document.getElementById('res-type').value;
      const title = document.getElementById('res-title').value.trim();
      const url = document.getElementById('res-url').value.trim();
      if (!appState.classResources[cls]) appState.classResources[cls] = [];
      appState.classResources[cls].unshift({
        id: 'res-' + Date.now(),
        type,
        title,
        url,
        addedBy: appState.currentUser.fullName,
      });
      saveState();
      showToast('تمت إضافة المحتوى إلى مكتبة الفصل بنجاح ✅', '🎒');
      render();
    }

    function appendStickerToChat(sticker) {
      const inp = document.getElementById('chat-msg-input');
      if (inp) inp.value = (inp.value + ' ' + sticker).trim();
    }

    function sendServantChatMessage(e, cls) {
      e.preventDefault();
      if (isStudent()) return;
      const inp = document.getElementById('chat-msg-input');
      const text = inp.value.trim();
      if (!text) return;
      if (!appState.servantChats[cls]) appState.servantChats[cls] = [];
      appState.servantChats[cls].push({
        id: 'msg-' + Date.now(),
        sender: appState.currentUser.fullName,
        role: isAdmin() ? 'أدمن' : 'خادم',
        text,
        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
      });
      inp.value = '';
      saveState();
      render();
    }

    // =========================================================================
    // 13. لوحة الإدارة الشاملة للأدمن فقط (طلبات الانضمام + الحسابات + كلمات السر + Excel)
    // =========================================================================
    function renderAdminTab() {
      if (!isAdmin()) return '';

      return `
        <div class="space-y-6">
          <div class="bg-gradient-to-l from-slate-900 to-blue-950 text-white rounded-3xl p-5 sm:p-6 shadow-kid flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-lg sm:text-xl font-black">👑 لوحة تحكم الأدمن الشاملة</h2>
              <p class="text-xs font-bold text-blue-200">إدارة طلبات الانضمام، كلمات السر، نقل الفصول، ترقية الأدمن، وتصدير بيانات Excel</p>
            </div>
            <button onclick="exportAllStudentsExcelCSV()" class="btn-kid bg-emerald-500 hover:bg-emerald-600 text-white font-black px-4 py-2.5 rounded-2xl text-xs sm:text-sm shadow">
              📊 استخراج ملف Excel لبيانات المخدومين
            </button>
          </div>

          <!-- قائمة البيانات الكاملة لطلبات الانضمام (للأدمن فقط) -->
          <div class="bg-white rounded-3xl p-5 border-2 border-amber-200 shadow-card space-y-4">
            <h3 class="text-base font-black text-amber-950">📋 قائمة البيانات الكاملة لطلبات الانضمام (للأدمن فقط)</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-right text-xs">
                <thead>
                  <tr class="bg-amber-50 text-amber-950 font-black">
                    <th class="p-2.5">الصورة</th>
                    <th class="p-2.5">الاسم ثلاثي</th>
                    <th class="p-2.5">الدور</th>
                    <th class="p-2.5">تليفون المخدوم</th>
                    <th class="p-2.5">تليفون ولي الأمر</th>
                    <th class="p-2.5">تاريخ الميلاد</th>
                    <th class="p-2.5">الفصل</th>
                    <th class="p-2.5">الحالة</th>
                    <th class="p-2.5">إجراء الأدمن</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-bold">
                  ${
                    appState.joinRequests.length
                      ? appState.joinRequests
                          .map(
                            (r) => `
                        <tr>
                          <td class="p-2"><img src="${r.avatar}" class="w-10 h-10 rounded-full object-cover" alt="صورة" /></td>
                          <td class="p-2 font-black text-slate-900">${escapeHtml(r.fullName)}</td>
                          <td class="p-2">${r.role === 'servant' ? '🛡️ خادم' : '🎒 مخدوم'}</td>
                          <td class="p-2">${escapeHtml(r.phone)}</td>
                          <td class="p-2">${escapeHtml(r.parentPhone)}</td>
                          <td class="p-2">${escapeHtml(r.birthDate)}</td>
                          <td class="p-2">${escapeHtml(r.className)}</td>
                          <td class="p-2">
                            <span class="px-2.5 py-1 rounded-full text-[11px] font-black ${
                              r.status === 'pending'
                                ? 'bg-amber-100 text-amber-900'
                                : r.status === 'approved'
                                ? 'bg-emerald-100 text-emerald-800'
                                : 'bg-rose-100 text-rose-800'
                            }">
                              ${r.status === 'pending' ? 'قيد المراجعة' : r.status === 'approved' ? 'مقبول' : 'مرفوض'}
                            </span>
                          </td>
                          <td class="p-2 flex flex-wrap gap-1.5">
                            ${
                              r.status === 'pending'
                                ? `
                              <button onclick="approveJoinRequest('${r.id}')" class="bg-emerald-600 text-white px-2.5 py-1.5 rounded-xl font-extrabold">اعتماد ✅</button>
                              <button onclick="rejectJoinRequest('${r.id}')" class="bg-rose-600 text-white px-2.5 py-1.5 rounded-xl font-extrabold">رفض ❌</button>
                            `
                                : ''
                            }
                            <button onclick="deleteJoinRequest('${r.id}')" class="bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-xl font-extrabold">حذف</button>
                          </td>
                        </tr>
                      `
                          )
                          .join('')
                      : `<tr><td colspan="9" class="p-4 text-center text-slate-500">لا توجد طلبات انضمام جديدة حالياً.</td></tr>`
                  }
                </tbody>
              </table>
            </div>
          </div>

          <!-- إضافة تعليمات للخدام في كل الفصول -->
          <form onsubmit="addAdminInstructionForServants(event)" class="bg-white rounded-3xl p-5 border-2 border-blue-100 shadow-card space-y-3">
            <h3 class="text-base font-black text-blue-950">📌 إرسال تعليمات من الأدمن للخدام فقط في كل الفصول</h3>
            <div class="flex gap-2">
              <input id="admin-inst-input" type="text" required placeholder="اكتب التعليمات لتظهر للخدام فقط في جميع الفصول..." class="flex-1 px-4 py-2.5 rounded-2xl border border-slate-300 text-xs font-bold outline-none" />
              <button type="submit" class="btn-kid bg-blue-600 text-white px-4 py-2.5 rounded-2xl text-xs font-extrabold">نشر للخدام</button>
            </div>
          </form>

          <!-- إدارة جميع الحسابات النشطة (كلمات السر + نقل الفصول + ترقية لأدمن) -->
          <div class="bg-white rounded-3xl p-5 border-2 border-indigo-100 shadow-card space-y-4">
            <h3 class="text-base font-black text-indigo-950">👥 إدارة حسابات الخدام والمخدومين والأدمن (كلمات السر ونقل الفصول)</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-right text-xs">
                <thead>
                  <tr class="bg-indigo-50 text-indigo-950 font-black">
                    <th class="p-2.5">الاسم</th>
                    <th class="p-2.5">الدور</th>
                    <th class="p-2.5">رقم التليفون</th>
                    <th class="p-2.5">كلمة السر 🔑</th>
                    <th class="p-2.5">الفصل (نقل)</th>
                    <th class="p-2.5">صلاحية الأدمن</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-bold">
                  ${appState.users
                    .map(
                      (u) => `
                    <tr>
                      <td class="p-2.5 font-black text-slate-900">${escapeHtml(u.fullName)}</td>
                      <td class="p-2.5">${u.role === 'admin' ? '👑 أدمن' : u.role === 'servant' ? '🛡️ خادم' : '🎒 مخدوم'}</td>
                      <td class="p-2.5">${escapeHtml(u.phone)}</td>
                      <td class="p-2.5 font-mono text-rose-700 font-black">${escapeHtml(u.password)}</td>
                      <td class="p-2.5">
                        <select onchange="transferUserClass('${u.id}', this.value)" class="px-2.5 py-1 rounded-xl border border-slate-300 bg-white font-bold">
                          ${CLASSES.map((c) => `<option value="${c}" ${u.className === c ? 'selected' : ''}>${c}</option>`).join('')}
                        </select>
                      </td>
                      <td class="p-2.5">
                        ${
                          u.id !== appState.currentUser.id
                            ? `<button onclick="toggleUserAdminRole('${u.id}')" class="px-2.5 py-1 rounded-xl font-extrabold ${
                                u.role === 'admin' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-900'
                              }">
                                ${u.role === 'admin' ? 'سحب صلاحية الأدمن' : 'ترقية إلى أدمن 👑'}
                              </button>`
                            : `<span class="text-slate-400">حسابك الحالي</span>`
                        }
                      </td>
                    </tr>
                  `
                    )
                    .join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function approveJoinRequest(reqId) {
      const req = appState.joinRequests.find((r) => r.id === reqId);
      if (!req) return;
      req.status = 'approved';
      const newUser = {
        id: (req.role === 'servant' ? 'srv-' : 'stu-') + Date.now(),
        role: req.role,
        fullName: req.fullName,
        phone: req.phone,
        parentPhone: req.parentPhone,
        password: req.password,
        birthDate: req.birthDate,
        className: req.className,
        assignedClasses: req.role === 'servant' ? [req.className] : [],
        status: 'approved',
        avatar: req.avatar,
        quickLoginEnabled: false,
      };
      appState.users.push(newUser);
      if (newUser.role === 'student') getStudentScore(newUser.id);
      saveState();
      showToast(`تم اعتماد وقبول (${req.fullName}) وتفعيل حسابه في ${req.className} ✅`, '🎉');
      render();
    }

    function rejectJoinRequest(reqId) {
      const req = appState.joinRequests.find((r) => r.id === reqId);
      if (!req) return;
      req.status = 'rejected';
      saveState();
      showToast(`تم رفض طلب (${req.fullName})`, '❌');
      render();
    }

    function deleteJoinRequest(reqId) {
      appState.joinRequests = appState.joinRequests.filter((r) => r.id !== reqId);
      saveState();
      render();
    }

    function addAdminInstructionForServants(e) {
      e.preventDefault();
      const inp = document.getElementById('admin-inst-input');
      const text = inp.value.trim();
      if (!text) return;
      appState.adminServantInstructions.unshift({
        id: 'inst-' + Date.now(),
        text,
        time: 'الآن',
      });
      inp.value = '';
      saveState();
      showToast('تم إرسال التعليمات للخدام في كل الفصول بنجاح 📌', '✅');
      render();
    }

    function transferUserClass(userId, newClass) {
      const u = appState.users.find((x) => x.id === userId);
      if (!u) return;
      u.className = newClass;
      if (u.role === 'servant') u.assignedClasses = [newClass];
      saveState();
      showToast(`تم نقل (${u.fullName}) إلى ${newClass} بنجاح`, '🏫');
      render();
    }

    function toggleUserAdminRole(userId) {
      const u = appState.users.find((x) => x.id === userId);
      if (!u) return;
      if (u.role === 'admin') {
        u.role = 'servant';
        u.assignedClasses = [u.className];
        showToast(`تم تحويل (${u.fullName}) إلى دور خادم`, '🛡️');
      } else {
        u.role = 'admin';
        u.assignedClasses = [...CLASSES];
        showToast(`تمت ترقية (${u.fullName}) إلى أدمن بصلاحيات كاملة 👑`, '🎉');
      }
      saveState();
      render();
    }

    function exportAllStudentsExcelCSV() {
      const students = appState.users.filter((u) => u.role === 'student' && u.status === 'approved');
      const headers = [
        'الاسم الثلاثي',
        'الفصل',
        'رقم تليفون المخدوم',
        'رقم تليفون ولي الأمر',
        'تاريخ الميلاد',
        'درجة الحضور',
        'التقييم الأسبوعي (من 45)',
        'درجة المسابقة',
        'أيام القراءات التراكمي',
        'درجات القراءات التراكمي',
        'البونات المتاحة',
        'المجموع التراكمي الكلي',
      ];
      const rows = students.map((s) => {
        const sc = getStudentScore(s.id);
        const total = sc.evalTotal + sc.quizTotal + sc.readingCumulativePts;
        return [
          s.fullName,
          s.className,
          s.phone,
          s.parentPhone,
          s.birthDate,
          sc.attendancePts,
          sc.evalTotal,
          sc.quizTotal,
          sc.readingCumulativeDays,
          sc.readingCumulativePts,
          sc.bonatCumulativeAvailable,
          total,
        ];
      });

      const csvContent =
        '\uFEFF' +
        [headers, ...rows]
          .map((row) => row.map((cell) => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
          .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'بيانات_مخدومي_مدرسة_الكتاب_المقدس.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('تم تصدير ملف Excel (CSV) لبيانات المخدومين بنجاح 📊', '✅');
    }

    // =========================================================================
    // 14. دالة العرض الرئيسية (Main Render)
    // =========================================================================
    function render() {
      const root = document.getElementById('app');
      if (!root) return;
      if (appState.screen === 'cover') {
        root.innerHTML = renderCoverScreen();
      } else if (appState.screen === 'auth' || !appState.currentUser) {
        root.innerHTML = renderAuthScreen();
      } else {
        root.innerHTML = renderAppShell();
      }
    }

    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
